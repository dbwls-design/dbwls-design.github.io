<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Band Busking — Week 02</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
  <style>
    /* 색 정의 — 포스터와 같은 종이색, 마젠타, 검정 */
    :root {
      --paper: #f4f2ed;
      --ink: #181418;
      --magenta: #be0876;
      --muted: #6b6862;
      --line: #dedad2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
      font-weight: 300;
      padding: 56px 16px 64px;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
    }

    .label {
      font-family: "Poiret One", sans-serif;
      font-size: 13px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      font-family: "Poiret One", sans-serif;
      font-weight: 400;
      font-size: clamp(40px, 12vw, 64px);
      letter-spacing: 0.06em;
      line-height: 1;
      color: var(--magenta);
      margin: 14px 0 32px;
    }

    /* 포스터: 누르면 인쇄용 원본(PNG)이 열림 */
    .poster img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 1px 2px rgba(24, 20, 24, 0.08), 0 14px 36px rgba(24, 20, 24, 0.14);
    }

    /* 포스터 정보 목록 */
    .info { margin-top: 40px; }
    .info div {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 16px;
      padding: 16px 0;
      border-top: 1px solid var(--line);
      font-size: 14px;
      line-height: 1.7;
    }
    .info div:last-child { border-bottom: 1px solid var(--line); }
    .info dt { padding-top: 2px; }
    .info a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--line);
    }
    .info a:hover { border-color: var(--ink); }

    footer {
      display: flex;
      justify-content: space-between;
      margin-top: 40px;
      font-size: 13px;
    }
    footer a {
      color: var(--muted);
      text-decoration: none;
    }
    footer a:hover { color: var(--magenta); }

    /* 휴대폰 화면 */
    @media (max-width: 480px) {
      body { padding-top: 40px; }
      .info div { grid-template-columns: 72px 1fr; gap: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="label">Week 02 — Poster</p>
    <h1>Band Busking</h1>

    <a class="poster" href="band-busking_guitar.png" title="인쇄용 원본 크기로 보기">
      <img src="../images/week2-band-busking.jpg" width="1400" height="1980"
           alt="거꾸로 세운 기타를 마젠타와 검정 망점으로 찍은 BAND BUSKING 2026.11.04 포스터">
    </a>

    <dl class="info">
      <div>
        <dt class="label">Size</dt>
        <dd>A3 세로 · 3564×5040px</dd>
      </div>
      <div>
        <dt class="label">Ink</dt>
        <dd>마젠타와 검정, 2색 하프톤</dd>
      </div>
      <div>
        <dt class="label">Type</dt>
        <dd>Poiret One</dd>
      </div>
      <div>
        <dt class="label">Photo</dt>
        <dd><a href="https://unsplash.com/photos/xmksM4em7a0" target="_blank" rel="noopener">Apolo Photographer / Unsplash</a></dd>
      </div>
    </dl>

    <footer>
      <a href="../week1/">← Week 01</a>
      <a href="band-busking_guitar.png">원본 PNG 보기 (14.9MB)</a>
    </footer>
  </main>
</body>
</html>
